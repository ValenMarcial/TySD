<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Analog Clock</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100wh;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            font-family: sans-serif;
        }
        #clock-container {
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>

    <h1>HTML AJAX clock demo</h1>

    <!-- Container where the clock will be generated -->
    <div id="clock-container"></div>
    <button id="client-address-button" type="button">Consultar IP y puerto</button>
    <p id="client-address" aria-live="polite"></p>

    <script>
        const container = document.getElementById("clock-container");
        const clientAddress = document.getElementById("client-address");

        function createAnalogClock() {
            // Generate the SVG structure
            container.innerHTML = `
                <svg viewBox="0 0 200 200" width="100%" height="100%">
                    <!-- Clock Face Background -->
                    <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#333333" stroke-width="4"/>

                    <!-- Hour Markers (Ticks) -->
                    <g id="clock-ticks" stroke="#333333" stroke-linecap="round"></g>

                    <!-- Hands -->
                    <line id="hour-hand" x1="100" y1="100" x2="100" y2="55" stroke="#333333" stroke-width="6" stroke-linecap="round" />
                    <line id="minute-hand" x1="100" y1="100" x2="100" y2="40" stroke="#666666" stroke-width="4" stroke-linecap="round" />
                    <line id="second-hand" x1="100" y1="100" x2="100" y2="30" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" />

                    <!-- Center Pin -->
                    <circle cx="100" cy="100" r="4" fill="#ff3b30"/>
                </svg>
            `;

            // Generate the 12 hour ticks
            const ticksGroup = container.querySelector('#clock-ticks');
            const svgNS = "http://www.w3.org/2000/svg";
            for (let i = 0; i < 12; i++) {
                const angle = i * 30; // 360 degrees / 12  = 30 degrees each
                const isMajor = i % 3 === 0;
                const tickLength = isMajor ? 12 : 6;
                const strokeWidth = isMajor ? 3 : 1.5;

                const tick = document.createElementNS(svgNS, "line");
                tick.setAttribute("x1", "100");
                tick.setAttribute("y1", "10");
                tick.setAttribute("x2", "100");
                tick.setAttribute("y2", (10 + tickLength).toString());
                tick.setAttribute("stroke-width", strokeWidth.toString());
                tick.setAttribute("transform", `rotate(${angle} 100 100)`);
                ticksGroup.appendChild(tick);
            }
        }

        // 4. Update Function
        function updateClock(hour, minutes, seconds) {
            // Calculate rotation angles in degrees
            const hourAngle = (hour % 12) * 30 + minutes * 0.5; 
            const minAngle = minutes * 6 + seconds * 0.1;
            const secAngle = seconds * 6;

            // Apply SVG rotations around the center point (100, 100)
            hourHand.setAttribute('transform', `rotate(${hourAngle} 100 100)`);
            minHand.setAttribute('transform', `rotate(${minAngle} 100 100)`);
            secHand.setAttribute('transform', `rotate(${secAngle} 100 100)`);
        }

        function requestTime() {
            fetch('/time')
            .then(function (response) {
                if (response.status == 200) {
                    // we know it is json data, return as a javascript object
                    return response.json();
                } else {
                    console.log('Error fecthing time ' + response.status)
                }
            })
            .then(t => {
                // t is a javascript object {hour: h, minutes: m, seconds: s}
                updateClock(t.hour, t.minutes, t.seconds);
            })
        }

        function requestClientAddress() {
            fetch('/client-address')
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('Error al consultar la dirección: ' + response.status);
                }
                return response.json();
            })
            .then(function (address) {
                clientAddress.textContent = `IP: ${address.ip} | Puerto: ${address.port}`;
            })
            .catch(function (error) {
                clientAddress.textContent = error.message;
            });
        }

        createAnalogClock();
        const hourHand = container.querySelector('#hour-hand');
        const minHand = container.querySelector('#minute-hand');
        const secHand = container.querySelector('#second-hand');
        document.getElementById('client-address-button')
            .addEventListener('click', requestClientAddress);
        
        // request time each second (pooling)
        setInterval(requestTime, 1000);
    </script>
</body>
</html>
